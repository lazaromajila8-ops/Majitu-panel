
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJITU PANEL</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080808;
color:white;
}
header{
background:#111;
padding:25px 12px;
text-align:center;
border-bottom:3px solid #d4af37;
}
h1,h2{color:#d4af37;text-align:center}
.container{padding:18px;max-width:600px;margin:auto}
.card{
background:#171717;
border:1px solid #d4af37;
border-radius:12px;
padding:18px;
margin:15px 0;
}
input,select{
width:100%;
padding:13px;
margin:8px 0;
border-radius:7px;
border:1px solid #d4af37;
background:#090909;
color:white;
font-size:16px;
}
button{
width:100%;
padding:14px;
background:#d4af37;
color:#080808;
border:0;
border-radius:8px;
font-weight:bold;
font-size:16px;
margin-top:12px;
}
.price{
display:flex;
justify-content:space-between;
border-bottom:1px solid #444;
padding:12px 0;
}
#dashboard{display:none}
#authMessage{
text-align:center;
overflow-wrap:anywhere;
}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>

<body>

<header>
<h1>🔥 MAJITU PANEL 🔥</h1>
<p>Huduma za Mitandao ya Kijamii</p>
</header>

<!-- LOGIN / REGISTER -->

<div class="container" id="authSection">
<div class="card">
<h2>ACCOUNT LOGIN / REGISTER</h2>

<input id="userEmail" type="email"
placeholder="Email Address">

<input id="userPassword" type="password"
placeholder="Password (angalau herufi 6)">

<button onclick="registerUser()">SIGN UP</button>

<button onclick="loginUser()">LOGIN</button>

<button onclick="resetPassword()"
style="background:#333;color:white">
FORGOT PASSWORD?
</button>

<p id="authMessage"></p>
</div>
</div>

<!-- DASHBOARD -->

<div class="container" id="dashboard">

<div class="card">
<h2>🔥 KARIBU MAJITU PANEL 🔥</h2>
<p style="text-align:center">
Karibu kwenye Dashboard yetu.
</p>
<p id="welcomeUser" style="text-align:center"></p>
<button onclick="logoutUser()">LOGOUT</button>
</div>

<div class="card">
<h2>🔥 BEI ZA HUDUMA 🔥</h2>

<div id="priceList"></div>

</div>

<div class="card">
<h2>🛒 WEKA ODA YAKO</h2>

<label>Jina lako</label>
<input id="name" placeholder="Andika jina lako">

<label>Chagua mtandao</label>
<select id="network">
<option>Instagram</option>
<option>Facebook</option>
<option>TikTok</option>
</select>

<label>Chagua huduma</label>
<select id="service">
<option>Followers</option>
<option>Likes</option>
<option>Views</option>
</select>

<label>Link ya akaunti</label>
<input id="account" placeholder="Weka link ya akaunti">

<label>Kiasi unachohitaji</label>
<input id="quantity" type="number"
placeholder="Mfano 1000" min="1">

<button onclick="sendOrder()">
TUMA ODA WHATSAPP
</button>

</div>
</div>

<footer>
© 2026 MAJITU PANEL
<br>Huduma bora kwa wateja wetu.
</footer>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCo4VE_3AsxMwI7b5IE1fCjpmF-j3hi_Xc",
authDomain: "majitu-panel.firebaseapp.com",
projectId: "majitu-panel",
storageBucket: "majitu-panel.firebasestorage.app",
messagingSenderId: "72060971480",
appId: "1:72060971480:web:94adcb30dee3563b1caaad",
measurementId: "G-7F9SZ3DHY1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// BEI ZA HUDUMA
// Badilisha Weka bei na bei zako.

const prices = [
["Instagram Followers","Weka bei"],
["Facebook Followers","Weka bei"],
["TikTok Followers","Weka bei"],
["Instagram Likes","Weka bei"],
["TikTok Likes","Weka bei"],
["Facebook Likes","Weka bei"],
["Instagram Views","Weka bei"],
["TikTok Views","Weka bei"],
["Facebook Views","Weka bei"]
];

document.getElementById("priceList").innerHTML =
prices.map(item =>
`<div class="price">
<b>${item[0]}</b>
<span>${item[1]}</span>
</div>`
).join("");

// REGISTER

function registerUser(){

const email =
document.getElementById("userEmail").value.trim();

const password =
document.getElementById("userPassword").value;

const message =
document.getElementById("authMessage");

if(!email || !password){
message.innerText="Jaza email na password.";
return;
}

auth.createUserWithEmailAndPassword(email,password)

.then(()=>{
message.innerText="Akaunti imetengenezwa!";
})

.catch(error=>{
message.innerText=error.message;
});

}

// LOGIN

function loginUser(){

const email =
document.getElementById("userEmail").value.trim();

const password =
document.getElementById("userPassword").value;

const message =
document.getElementById("authMessage");

if(!email || !password){
message.innerText="Jaza email na password.";
return;
}

auth.signInWithEmailAndPassword(email,password)

.catch(error=>{
message.innerText=error.message;
});

}

// FORGOT PASSWORD

function resetPassword(){

const email =
document.getElementById("userEmail").value.trim();

const message =
document.getElementById("authMessage");

if(!email){
message.innerText="Weka email yako kwanza.";
return;
}

auth.sendPasswordResetEmail(email)

.then(()=>{
message.innerText="Email ya kubadilisha password imetumwa.";
})

.catch(error=>{
message.innerText=error.message;
});

}

// LOGOUT

function logoutUser(){
auth.signOut();
}

// AUTHENTICATION CHECK

auth.onAuthStateChanged(user=>{

const authSection =
document.getElementById("authSection");

const dashboard =
document.getElementById("dashboard");

if(user){

authSection.style.display="none";
dashboard.style.display="block";

document.getElementById("welcomeUser").innerText =
"Umeingia kama: "+user.email;

}else{

authSection.style.display="block";
dashboard.style.display="none";

}

});

// WHATSAPP ORDER

function sendOrder(){

const name =
document.getElementById("name").value.trim();

const network =
document.getElementById("network").value;

const service =
document.getElementById("service").value;

const account =
document.getElementById("account").value.trim();

const quantity =
document.getElementById("quantity").value;

if(!auth.currentUser){
alert("Tafadhali ingia kwanza.");
return;
}

if(!name || !account || !quantity ||
Number(quantity)<=0){
alert("Tafadhali jaza taarifa zote.");
return;
}

const message =
"MAJITU PANEL ODA\n"+
"Jina: "+name+"\n"+
"Email: "+auth.currentUser.email+"\n"+
"Mtandao: "+network+"\n"+
"Huduma: "+service+"\n"+
"Link: "+account+"\n"+
"Kiasi: "+quantity;

const url =
"https://wa.me/255768130923?text="+
encodeURIComponent(message);

window.open(url,"_blank");

}

</script>

</body>
</html>
